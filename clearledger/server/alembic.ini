# Alembic подключён ТОЛЬКО как сверка схемы, выпуск он не трогает.
# Схему по-прежнему создаёт create_all плюс ручные операторы в app/database.py; задача
# здесь — уметь ответить на вопрос «схема в базе совпадает с моделями?», который до
# сих пор решался глазами.
#
#   alembic stamp head     — один раз на каждом стенде: отметить, что база соответствует
#                            базовой ревизии (саму схему stamp не меняет)
#   alembic check          — сверка: молчит, когда совпадает; иначе печатает различия
#   alembic revision --autogenerate -m "..."  — заготовка ревизии, когда перейдём на миграции
#
# DSN берётся из окружения приложения (DATABASE_URL), чтобы не было второго места,
# где прописан адрес базы.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
