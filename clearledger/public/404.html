<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA-fallback: статика отдаётся с корня домена, любой маршрут открывает index.
    window.location.replace('/?route=' + encodeURIComponent(
      window.location.pathname + window.location.search))
  </script>
</head>

</html>
