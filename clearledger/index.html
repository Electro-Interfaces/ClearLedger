<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover обязателен вместе с safe-area: без него env(safe-area-inset-*)
         всегда 0, и в установленном приложении на iPhone нижняя навигация ложится на
         домашний индикатор, а шапка при прозрачном статус-баре уезжает под «чёлку». -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Иконки вкладки не было вовсе: браузер спрашивал /favicon.ico, получал 404 и рисовал
         глобус. Путь через %BASE_URL% — на случай сборки под путь; относительная ссылка
         ломалась бы на вложенных маршрутах вроде /finance/objects. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Стартовый заголовок; дальше его ведёт приложение (DocumentTitle) — иначе все
         вкладки продуктов назывались бы одинаково. -->
    <title>Рабочее пространство</title>
    <!-- PWA: «Пульс» ставится на телефон отдельным приложением. Манифест
         указывает start_url на /pulse — человек открывает свою витрину, а не
         общий рабочий стол, ради которого он приложение не ставил. -->
    <link rel="manifest" href="/pulse.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Пульс" />
    <!-- iOS манифест не читает: иконку для «На экран «Домой»» берёт только отсюда. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA: restore route from 404.html redirect
      (function() {
        var q = new URLSearchParams(window.location.search);
        var route = q.get('route');
        if (route) {
          history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + route);
        }
      })();
    </script>
    <script>
      // Theme: apply dark class before paint to prevent flash
      (function() {
        var t = localStorage.getItem('clearledger-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
