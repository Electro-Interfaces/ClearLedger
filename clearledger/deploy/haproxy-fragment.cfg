# Фрагмент для добавления в /etc/haproxy/haproxy.cfg на rproxy (10.10.70.99).
# Добавить в frontend секцию (https-in) и создать backend.

# ── Frontend ACL (добавить в https-in / http-in где роутится по hostname) ──
#
#   acl host_ledger hdr(host) -i ledger.dataworker.ru
#   use_backend ledger_backend if host_ledger
#
# Для ACME-challenge во время выпуска LE-сертификата:
#   acl is_acme path_beg /.well-known/acme-challenge/
#   use_backend letsencrypt-backend if is_acme

# ── Backend ledger_backend ──────────────────────────────────────────
backend ledger_backend
    mode http
    option httpchk GET /health
    http-check expect status 200
    server services-01 10.10.70.51:8090 check inter 10s rise 2 fall 3
    timeout server 300s
    # ClearLedger sync 1С может занять минуты — даём 5 минут

# ── SSL termination в frontend https-in (уже есть в основном конфиге) ──
# bind *:443 ssl crt /etc/ssl/dataworker/ledger.dataworker.ru.pem
