# ClearLedger production stack для services-01 (10.10.70.51, Miran)
# Развёртывание: docker compose up -d
# Доступ: HAProxy на rproxy → http://services-01:8090
#
# Переменные через .env рядом (см. .env.example):
#   POSTGRES_PASSWORD — пароль для postgres
#   COM_AGENT_URL    — http://10.10.70.45:8080 (1c-dev-01)
#   COM_AGENT_TOKEN  — Bearer secret COM-агента
#   JWT_SECRET       — секрет для JWT-токенов backend (маппится в SECRET_KEY)
#   CORS_ORIGINS     — https://ledger.dataworker.ru
#   SEED_SUPERADMIN_EMAIL / SEED_SUPERADMIN_PASSWORD — опц., разовый запуск для
#                      создания суперадмина; после создания убрать из .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clearledger
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5433:5432"  # экспорт только на loopback (для бэкапов)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../server
      dockerfile: ../deploy/backend.Dockerfile
    container_name: ledger-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://clearledger:${POSTGRES_PASSWORD}@postgres:5432/clearledger
      # Приложение читает секрет JWT из SECRET_KEY. Хостовая переменная исторически
      # называется JWT_SECRET (deploy/.env) — маппим её в правильное имя, иначе
      # backend брал небезопасный дефолт и токены подделывались.
      SECRET_KEY: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ledger.dataworker.ru}
      # Суперадмин на старте создаётся ТОЛЬКО при заданных обеих переменных.
      # Пусто → дефолтного бэкдора admin@clearledger.ru/admin123 не будет.
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      COM_AGENT_URL: ${COM_AGENT_URL:-http://10.10.70.45:8080}
      COM_AGENT_TOKEN: ${COM_AGENT_TOKEN}
      EDGE_DESIRED_AGENT_VERSION: ${EDGE_DESIRED_AGENT_VERSION:-0.55.0}
      LOG_LEVEL: INFO
      # Сверки — внешние API (значения в deploy/.env, НЕ в git)
      TRADECORP_API_URL: ${TRADECORP_API_URL:-}
      TRADECORP_LOGIN: ${TRADECORP_LOGIN:-}
      TRADECORP_PASSWORD: ${TRADECORP_PASSWORD:-}
      TRADECORP_EMITENT_ID: ${TRADECORP_EMITENT_ID:-15}
      MSTO_API_URL: ${MSTO_API_URL:-}
      MSTO_USERNAME: ${MSTO_USERNAME:-}
      MSTO_PASSWORD: ${MSTO_PASSWORD:-}
      # SMTP — приглашения сотрудников (Mailcow на этом же хосте). Значения в
      # deploy/.env. Пусто → dev-режим (ссылка в логе). 10.10.70.51 — внутр. IP.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-ledger@dataworker.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-TradeLedger <ledger@dataworker.ru>}
      SMTP_SERVERNAME: ${SMTP_SERVERNAME:-mail.dataworker.ru}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://ledger.dataworker.ru/ClearLedger}
      # Видеоконференции Jitsi (RS256/ASAP). Приватный ключ (base64 PEM) — в deploy/.env, НЕ в git.
      JITSI_SIGNING_KEY: ${JITSI_SIGNING_KEY:-}
      JITSI_KID: ${JITSI_KID:-ledger/1}
      # HubEx FSM (сервисные заявки ЭЗС). Токен — секрет, только в deploy/.env.
      HUBEX_SERVICE_TOKEN: ${HUBEX_SERVICE_TOKEN:-}
      HUBEX_BASE_URL: ${HUBEX_BASE_URL:-https://api.hubex.ru/fsm}
      HUBEX_APP_ID: ${HUBEX_APP_ID:-5}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../
      dockerfile: deploy/frontend.Dockerfile
      args:
        # ВАЖНО: origin БЕЗ /api — пути сервисов фронта уже содержат /api/...
        # (иначе двойной /api/api → 404 на логине и всех запросах).
        VITE_API_URL: ${VITE_API_URL:-https://ledger.dataworker.ru}
    container_name: ledger-frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: ledger-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./agent-dist:/usr/share/nginx/agent:ro
    ports:
      - "8090:80"  # HAProxy на rproxy будет ходить сюда (10.10.70.51:8090)
